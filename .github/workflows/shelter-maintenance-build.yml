# Manual two-phase cloud reproduction/staging only. Never renames/deletes/edits releases or tags.
name: Rin Shelter frozen maintenance build and pending staging
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Build artifact first; stage only after the downloaded artifact is fully verified
        required: true
        default: build
        type: choice
        options: [build, stage]
      build_run_id:
        description: Successful build workflow run ID, required only for stage
        required: false
        type: string
      build_workflow_commit:
        description: Reviewed build run head SHA, required only for stage
        required: false
        type: string
      expected_manifest_sha256:
        description: Raw MANIFEST.json SHA256 after local complete verification, required only for stage
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: rin-shelter-87135ce-cloud
  cancel-in-progress: false
env:
  FROZEN_SOURCE: 87135ce05dacb2e0f434582187bedf48a231bef6
  FROZEN_EXE: 73396FCCAFD449CD195C536BCAB555B0DF1F4582771DACB3E917A56D56ABFD78
  ARTIFACT_NAME: rin-shelter-87135ce-cloud
  DOTNET_INSTALL_DIR: 'D:\Shelter桌宠\.tools\dotnet'
  DOTNET_CLI_HOME: 'D:\Shelter桌宠\.tools\cli-home'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
jobs:
  build:
    if: github.repository == 'Fantasy708/Rins-Little-Shelter' && github.ref == 'refs/heads/main' && inputs.phase == 'build'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 87135ce05dacb2e0f434582187bedf48a231bef6
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout reviewed workflow control files separately from frozen source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: workflow-control
          fetch-depth: 1
          persist-credentials: false
      - name: Restore frozen source and exact reviewed public-file bytes
        run: |
          $ErrorActionPreference='Stop'
          if((& git rev-parse 'HEAD^{commit}').Trim() -cne $env:FROZEN_SOURCE){throw 'Frozen checkout mismatch'}
          if(Test-Path -LiteralPath 'D:\Shelter桌宠\src'){throw 'Reproduction source directory already exists'}
          $archive=Join-Path $env:RUNNER_TEMP 'rin-frozen-source.zip'
          & git archive --format=zip -o $archive $env:FROZEN_SOURCE
          if($LASTEXITCODE){throw 'Read-only source archive failed'}
          Expand-Archive -LiteralPath $archive -DestinationPath 'D:\Shelter桌宠' -Force
          $audit='D:\Shelter桌宠\output\cloud-maintenance'
          [void](New-Item -ItemType Directory -Path $audit -Force)
          $encoded=''
          $inputStream=[IO.MemoryStream]::new([Convert]::FromBase64String($encoded))
          $gzip=[IO.Compression.GZipStream]::new($inputStream,[IO.Compression.CompressionMode]::Decompress)
          $reader=[IO.StreamReader]::new($gzip,[Text.Encoding]::UTF8)
          try{$json=$reader.ReadToEnd()}finally{$reader.Dispose();$gzip.Dispose();$inputStream.Dispose()}
          [IO.File]::WriteAllText((Join-Path $audit 'frozen-files.json'),$json,[Text.UTF8Encoding]::new($false))
          $helper=@'
          $ErrorActionPreference='Stop'
          $script:Frozen=Get-Content -LiteralPath (Join-Path $PSScriptRoot 'frozen-files.json') -Raw|ConvertFrom-Json -Depth 30
          function Assert-FrozenPublicFiles([switch]$Restore){
            foreach($item in $script:Frozen.Files){
              $path=Join-Path 'D:\Shelter桌宠' $item.Path
              if((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ine $item.SHA256 -and $Restore -and $item.CrlfMask){
                $raw=[IO.File]::ReadAllBytes($path);$clean=[Collections.Generic.List[byte]]::new()
                for($i=0;$i -lt $raw.Length;$i++){if($raw[$i] -eq 13 -and $i+1 -lt $raw.Length -and $raw[$i+1] -eq 10){continue};$clean.Add($raw[$i])}
                $mask=[Convert]::FromBase64String($item.CrlfMask);$restored=[Collections.Generic.List[byte]]::new();$line=0
                foreach($value in $clean){if($value -eq 10){if($mask[[int][Math]::Floor($line/8)] -band (1 -shl ($line%8))){$restored.Add(13)};$line++};$restored.Add($value)}
                [IO.File]::WriteAllBytes($path,$restored.ToArray())
              }
              if((Get-Item -LiteralPath $path).Length -ne $item.Bytes -or (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ine $item.SHA256){throw ('Frozen public bytes differ: '+$item.Path)}
            }
            if(@($script:Frozen.Files).Count -ne 283 -or @($script:Frozen.Files|Where-Object Runtime).Count -ne 33){throw 'Frozen source/runtime member count mismatch'}
          }
          '@
          [IO.File]::WriteAllText((Join-Path $audit 'check-frozen.ps1'),$helper,[Text.UTF8Encoding]::new($false))
          . (Join-Path $audit 'check-frozen.ps1')
          Assert-FrozenPublicFiles -Restore
      - name: Install exact local SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
      - name: Reproduce exact EXE with original Windows paths and bundle properties
        id: compile
        continue-on-error: true
        working-directory: 'D:\Shelter桌宠'
        run: |
          $ErrorActionPreference='Stop'
          $dotnet='D:\Shelter桌宠\.tools\dotnet\dotnet.exe'
          if((& $dotnet --version).Trim() -cne '10.0.401'){throw 'Exact SDK unavailable'}
          & $dotnet publish src/LittleShelter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=false -p:IncludeNativeLibrariesForSelfExtract=true -p:RestoreLockedMode=true '-p:BaseOutputPath=D:\Shelter桌宠\output\build-script\' -o dist/local/v1.1.0-shelter-compat-20261026/RinsLittleShelter
          if($LASTEXITCODE){throw 'Frozen reproduction build failed'}
          Copy-Item -LiteralPath assets/catalog.json -Destination dist/local/v1.1.0-shelter-compat-20261026/RinsLittleShelter/assets/catalog.json
      - name: Use verified tested-EXE reconstruction only if compile failed or differs
        working-directory: 'D:\Shelter桌宠'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $global:LASTEXITCODE=0
          . ./output/cloud-maintenance/check-frozen.ps1
          Assert-FrozenPublicFiles -Restore
          $program='D:\Shelter桌宠\dist\local\v1.1.0-shelter-compat-20261026\RinsLittleShelter'
          [void](New-Item -ItemType Directory -Path $program -Force)
          $exe=Join-Path $program 'RinsLittleShelter.exe'
          $compiledHash=if(Test-Path -LiteralPath $exe){(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash}else{''}
          $method='compiled-exact'
          if('${{ steps.compile.outcome }}' -cne 'success' -or $compiledHash -cne $env:FROZEN_EXE){
            $method='reconstructed-tested-exe'
            $control=Join-Path $env:GITHUB_WORKSPACE 'workflow-control/.github/maintenance/shelter-20261026'
            $patch=Join-Path $control 'patch.gz';$applier=Join-Path $control 'apply_rin_patch.py'
            if((Get-FileHash -LiteralPath $patch -Algorithm SHA256).Hash -cne 'B351BADBC642293240B33DE9F69E4E370CB531CC420E4AC1BF0B5CD12E95D65E'){throw 'Reviewed reconstruction patch differs'}
            if((Get-FileHash -LiteralPath $applier -Algorithm SHA256).Hash -cne '4AC68DECF9F1E40DFA7F6A4E396FF94AF58452DE4EDA89DB52CBC43E8AE2BE9D'){throw 'Reviewed reconstruction applier differs'}
            $fallback='D:\Shelter桌宠\output\cloud-maintenance\fallback'
            [void](New-Item -ItemType Directory -Path $fallback)
            $oldZip=Join-Path $fallback 'previous-tested-portable.zip'
            $asset=& gh api repos/Fantasy708/Rins-Little-Shelter/releases/assets/675491226|ConvertFrom-Json
            if($LASTEXITCODE -or $asset.id -ne 675491226 -or $asset.state -cne 'uploaded' -or $asset.digest -ine 'sha256:21e6a7597835846cbb505b7f0688b2f9c7c61c57dec3f838a1bd3151d2e9dee5'){throw 'Fixed previous public package identity differs'}
            $headers=@{Accept='application/octet-stream';Authorization=('Bearer '+$env:GH_TOKEN);'X-GitHub-Api-Version'='2022-11-28'}
            Invoke-WebRequest -Uri 'https://api.github.com/repos/Fantasy708/Rins-Little-Shelter/releases/assets/675491226' -Headers $headers -OutFile $oldZip
            if((Get-FileHash -LiteralPath $oldZip -Algorithm SHA256).Hash -cne '21E6A7597835846CBB505B7F0688B2F9C7C61C57DEC3F838A1BD3151D2E9DEE5'){throw 'Previous public portable bytes differ'}
            Add-Type -AssemblyName System.IO.Compression
            $zip=[IO.Compression.ZipFile]::OpenRead($oldZip)
            $oldExe=Join-Path $fallback 'previous-tested.exe'
            try{$entry=$zip.GetEntry('RinsLittleShelter/RinsLittleShelter.exe');if(-not $entry){throw 'Previous EXE missing'};$source=$entry.Open();$target=[IO.File]::Open($oldExe,[IO.FileMode]::CreateNew);try{$source.CopyTo($target)}finally{$target.Dispose();$source.Dispose()}}finally{$zip.Dispose()}
            if((Get-FileHash -LiteralPath $oldExe -Algorithm SHA256).Hash -cne '2B767B17F8D945484D7930DAE1F1822BE56C9EA47FD1AC9480A0B3C02653F797'){throw 'Previous tested EXE differs'}
            $reconstructed=Join-Path $fallback 'reconstructed-tested.exe'
            & python $applier $oldExe $patch $reconstructed
            if($LASTEXITCODE -ne 0){throw 'Reviewed tested-EXE reconstruction failed'}
            if((Get-FileHash -LiteralPath $reconstructed -Algorithm SHA256).Hash -cne $env:FROZEN_EXE){throw 'Reconstructed EXE is not the tested local EXE'}
            if(Test-Path -LiteralPath $exe){Move-Item -LiteralPath $exe -Destination (Join-Path $fallback 'rejected-publish.exe')}
            Copy-Item -LiteralPath $reconstructed -Destination $exe
          }
          foreach($item in $script:Frozen.Files|Where-Object Runtime){$target=Join-Path $program $item.Path;[void](New-Item -ItemType Directory -Path (Split-Path $target -Parent) -Force);Copy-Item -LiteralPath (Join-Path 'D:\Shelter桌宠' $item.Path) -Destination $target -Force}
          [IO.File]::WriteAllText('D:\Shelter桌宠\output\cloud-maintenance\reproduction-method.txt',$method,[Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText('D:\Shelter桌宠\output\cloud-maintenance\compiled-hash.txt',$compiledHash,[Text.UTF8Encoding]::new($false))
          $global:LASTEXITCODE=0
      - name: Mandatory exact tested EXE and 33-resource gate before packaging
        id: gate
        working-directory: 'D:\Shelter桌宠'
        run: |
          $ErrorActionPreference='Stop'
          . ./output/cloud-maintenance/check-frozen.ps1
          $program='dist/local/v1.1.0-shelter-compat-20261026/RinsLittleShelter'
          $actual=(Get-FileHash -LiteralPath "$program/RinsLittleShelter.exe" -Algorithm SHA256).Hash
          Write-Output ('Reproduced EXE SHA256: '+$actual)
          if($actual -cne $env:FROZEN_EXE){throw 'EXE is not byte-identical to the tested local EXE. Stop before any release attachment generation or artifact upload.'}
          if(Test-Path -LiteralPath "$program/RinsLittleShelter.pdb"){throw 'Unexpected PDB'}
          foreach($item in $script:Frozen.Files|Where-Object Runtime){if((Get-FileHash -LiteralPath (Join-Path $program $item.Path) -Algorithm SHA256).Hash -ine $item.SHA256){throw ('Published runtime resource differs: '+$item.Path)}}
          Assert-FrozenPublicFiles -Restore
          'exe_verified=true'|Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Package without rebuilding and verify all 283 source members
        if: success() && steps.gate.outputs.exe_verified == 'true'
        working-directory: 'D:\Shelter桌宠'
        run: |
          $ErrorActionPreference='Stop'
          . ./output/cloud-maintenance/check-frozen.ps1
          Assert-FrozenPublicFiles
          & ./scripts/package-release.ps1 -Version v1.1.0 -ProgramDirectory dist/local/v1.1.0-shelter-compat-20261026/RinsLittleShelter -ReleaseDirectory dist/cloud/shelter-maintenance/release -ReleaseNotes docs/releases/v1.1.0.md
          $release='D:\Shelter桌宠\dist\cloud\shelter-maintenance\release'
          Add-Type -AssemblyName System.IO.Compression
          $source=[IO.Compression.ZipFile]::OpenRead((Join-Path $release 'RinsLittleShelter-v1.1.0-source.zip'))
          try{
            $entries=@($source.Entries|Where-Object{-not $_.FullName.EndsWith('/')})
            if($entries.Count -ne 283){throw 'Source ZIP must contain exactly the 283 reviewed files'}
            foreach($entry in $entries){$path=$entry.FullName.Substring('RinsLittleShelter-source/'.Length);$record=@($script:Frozen.Files|Where-Object Path -ceq $path);if($record.Count -ne 1 -or $entry.Length -ne $record[0].Bytes){throw 'Unexpected source ZIP member'};$stream=$entry.Open();try{$hash=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($stream))}finally{$stream.Dispose()};if($hash -ine $record[0].SHA256){throw ('Packed source bytes differ: '+$path)}}
          }finally{$source.Dispose()}
          $portable=[IO.Compression.ZipFile]::OpenRead((Join-Path $release 'RinsLittleShelter-v1.1.0-win-x64.zip'))
          try{$entry=$portable.GetEntry('RinsLittleShelter/RinsLittleShelter.exe');$stream=$entry.Open();try{$hash=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($stream))}finally{$stream.Dispose()};if($hash -cne $env:FROZEN_EXE){throw 'Packed EXE differs'}}finally{$portable.Dispose()}
          $provenance=[ordered]@{SourceCommit=$env:FROZEN_SOURCE;EXESHA256=$env:FROZEN_EXE;SDK='10.0.401';RunId=$env:GITHUB_RUN_ID;WorkflowCommit=$env:GITHUB_SHA;ArtifactName=$env:ARTIFACT_NAME;ReproductionMethod=[IO.File]::ReadAllText('D:\Shelter桌宠\output\cloud-maintenance\reproduction-method.txt');CompiledEXESHA256=[IO.File]::ReadAllText('D:\Shelter桌宠\output\cloud-maintenance\compiled-hash.txt');RawSourceMembers=283;RuntimeAssets=33;ReleaseOrTagChanged=$false}
          [IO.File]::WriteAllText((Join-Path $release 'BUILD_PROVENANCE.json'),($provenance|ConvertTo-Json -Depth 10)+"`n",[Text.UTF8Encoding]::new($false))
          $names=@('RinsLittleShelter-v1.1.0-win-x64.zip','RinsLittleShelter-v1.1.0-source.zip','SHA256.txt','RinsLittleShelter-Setup.zip','Install-RinsLittleShelter.ps1','SHA256-Setup.txt','Uninstall-RinsLittleShelter.ps1','Uninstall-RinsLittleShelter.cmd')
          $manifest=[ordered]@{SourceCommit=$env:FROZEN_SOURCE;EXESHA256=$env:FROZEN_EXE;ArtifactName=$env:ARTIFACT_NAME;ProvenanceSHA256=(Get-FileHash -LiteralPath (Join-Path $release 'BUILD_PROVENANCE.json') -Algorithm SHA256).Hash;Files=@($names|ForEach-Object{$path=Join-Path $release $_;[ordered]@{Name=$_;Bytes=(Get-Item -LiteralPath $path).Length;SHA256=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash}})}
          [IO.File]::WriteAllText((Join-Path $release 'MANIFEST.json'),($manifest|ConvertTo-Json -Depth 20)+"`n",[Text.UTF8Encoding]::new($false))
          Write-Output ('Raw MANIFEST SHA256: '+(Get-FileHash -LiteralPath (Join-Path $release 'MANIFEST.json') -Algorithm SHA256).Hash)
      - name: Upload build artifact only, no release or tag writes
        if: success() && steps.gate.outputs.exe_verified == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rin-shelter-87135ce-cloud
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          path: |
            D:\Shelter桌宠\dist\cloud\shelter-maintenance\release\RinsLittleShelter-v1.1.0-win-x64.zip
            D:\Shelter桌宠\dist\cloud\shelter-maintenance\release\RinsLittleShelter-v1.1.0-source.zip
            D:\Shelter桌宠\dist\cloud\shelter-maintenance\release\SHA256.txt
            D:\Shelter桌宠\dist\cloud\shelter-maintenance\release\RinsLittleShelter-Setup.zip
            D:\Shelter桌宠\dist\cloud\shelter-maintenance\release\Install-RinsLittleShelter.ps1
            D:\Shelter桌宠\dist\cloud\shelter-maintenance\release\SHA256-Setup.txt
            D:\Shelter桌宠\dist\cloud\shelter-maintenance\release\Uninstall-RinsLittleShelter.ps1
            D:\Shelter桌宠\dist\cloud\shelter-maintenance\release\Uninstall-RinsLittleShelter.cmd
            D:\Shelter桌宠\dist\cloud\shelter-maintenance\release\RELEASE_NOTES.md
            D:\Shelter桌宠\dist\cloud\shelter-maintenance\release\BUILD_PROVENANCE.json
            D:\Shelter桌宠\dist\cloud\shelter-maintenance\release\MANIFEST.json
  stage:
    if: github.repository == 'Fantasy708/Rins-Little-Shelter' && github.ref == 'refs/heads/main' && inputs.phase == 'stage'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Fantasy708/Rins-Little-Shelter
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      BUILD_WORKFLOW_COMMIT: ${{ inputs.build_workflow_commit }}
      EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
    steps:
      - name: Validate explicit successful same-repository build run
        run: |
          $ErrorActionPreference='Stop'
          if($env:BUILD_RUN_ID -notmatch '^[1-9][0-9]*$' -or $env:BUILD_WORKFLOW_COMMIT -notmatch '^[a-f0-9]{40}$' -or $env:EXPECTED_MANIFEST_SHA256 -notmatch '^[a-fA-F0-9]{64}$'){throw 'Stage requires the locally verified run/CI commit/raw manifest SHA'}
          $run=& gh api "repos/$env:GH_REPO/actions/runs/$env:BUILD_RUN_ID"|ConvertFrom-Json
          if($LASTEXITCODE){throw 'Build run unavailable'}
          $workflow=& gh api "repos/$env:GH_REPO/actions/workflows/shelter-maintenance-build.yml"|ConvertFrom-Json
          if($LASTEXITCODE){throw 'Expected workflow unavailable'}
          if($run.status -cne 'completed' -or $run.conclusion -cne 'success' -or $run.event -cne 'workflow_dispatch' -or $run.head_branch -cne 'main' -or $run.head_repository.full_name -cne $env:GH_REPO -or $run.workflow_id -ne $workflow.id -or $run.head_sha -cne $env:BUILD_WORKFLOW_COMMIT -or $run.head_sha -cne $env:GITHUB_SHA){throw 'Build run is not the reviewed successful main run of this exact workflow commit'}
          $artifacts=& gh api "repos/$env:GH_REPO/actions/runs/$env:BUILD_RUN_ID/artifacts?per_page=100"|ConvertFrom-Json
          if($LASTEXITCODE -or @($artifacts.artifacts|Where-Object{$_.name -ceq $env:ARTIFACT_NAME -and -not $_.expired}).Count -ne 1){throw 'Expected one unexpired build artifact'}
      - uses: actions/download-artifact@v4
        with:
          name: rin-shelter-87135ce-cloud
          path: artifact
          github-token: ${{ github.token }}
          repository: Fantasy708/Rins-Little-Shelter
          run-id: ${{ inputs.build_run_id }}
      - name: Verify root-approved artifact then stage only eight pending names
        run: |
          $ErrorActionPreference='Stop'
          $root=(Resolve-Path -LiteralPath artifact).Path
          if((Get-FileHash -LiteralPath (Join-Path $root 'MANIFEST.json') -Algorithm SHA256).Hash -ine $env:EXPECTED_MANIFEST_SHA256){throw 'Raw manifest differs from the complete local acceptance'}
          $manifest=Get-Content -LiteralPath (Join-Path $root 'MANIFEST.json') -Raw|ConvertFrom-Json
          $provenance=Get-Content -LiteralPath (Join-Path $root 'BUILD_PROVENANCE.json') -Raw|ConvertFrom-Json
          if($manifest.SourceCommit -cne $env:FROZEN_SOURCE -or $manifest.EXESHA256 -cne $env:FROZEN_EXE -or $manifest.ArtifactName -cne $env:ARTIFACT_NAME -or (Get-FileHash -LiteralPath (Join-Path $root 'BUILD_PROVENANCE.json') -Algorithm SHA256).Hash -ine $manifest.ProvenanceSHA256){throw 'Frozen artifact identity/provenance digest mismatch'}
          if($provenance.SourceCommit -cne $env:FROZEN_SOURCE -or $provenance.EXESHA256 -cne $env:FROZEN_EXE -or $provenance.SDK -cne '10.0.401' -or [string]$provenance.RunId -cne $env:BUILD_RUN_ID -or $provenance.WorkflowCommit -cne $env:BUILD_WORKFLOW_COMMIT -or $provenance.ArtifactName -cne $env:ARTIFACT_NAME){throw 'Artifact provenance does not belong to the reviewed build run'}
          $names=@('RinsLittleShelter-v1.1.0-win-x64.zip','RinsLittleShelter-v1.1.0-source.zip','SHA256.txt','RinsLittleShelter-Setup.zip','Install-RinsLittleShelter.ps1','SHA256-Setup.txt','Uninstall-RinsLittleShelter.ps1','Uninstall-RinsLittleShelter.cmd')
          if(@($manifest.Files).Count -ne 8 -or @($manifest.Files.Name|Sort-Object -Unique).Count -ne 8 -or @(Compare-Object ($names|Sort-Object) ($manifest.Files.Name|Sort-Object)).Count){throw 'Manifest must enumerate exactly the eight fixed public names'}
          foreach($file in $manifest.Files){$path=Join-Path $root $file.Name;if((Get-Item -LiteralPath $path).Length -ne $file.Bytes -or (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ine $file.SHA256){throw ('Artifact bytes differ: '+$file.Name)}}
          Add-Type -AssemblyName System.IO.Compression
          $zip=[IO.Compression.ZipFile]::OpenRead((Join-Path $root 'RinsLittleShelter-v1.1.0-win-x64.zip'))
          try{$stream=$zip.GetEntry('RinsLittleShelter/RinsLittleShelter.exe').Open();try{$hash=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($stream))}finally{$stream.Dispose()};if($hash -cne $env:FROZEN_EXE){throw 'Staged portable EXE differs'}}finally{$zip.Dispose()}
          function Get-ExpectedRelease {
            $tag=& gh api "repos/$env:GH_REPO/git/ref/tags/v1.1.0"|ConvertFrom-Json
            if($LASTEXITCODE -or $tag.object.type -cne 'tag' -or $tag.object.sha -cne 'be846563575c6e214e60e8b5ce2bd5e37872d1b0'){throw 'Original tag object changed'}
            $peeled=& gh api "repos/$env:GH_REPO/git/tags/be846563575c6e214e60e8b5ce2bd5e37872d1b0"|ConvertFrom-Json
            if($LASTEXITCODE -or $peeled.object.type -cne 'commit' -or $peeled.object.sha -cne '15ed92d3e595ec5a23e25728b558659e2c0bbcd9'){throw 'Original tag target changed'}
            $release=& gh api "repos/$env:GH_REPO/releases/422599788"|ConvertFrom-Json
            if($LASTEXITCODE -or $release.id -ne 422599788 -or $release.tag_name -cne 'v1.1.0' -or $release.draft -or $release.prerelease){throw 'Original final release identity changed'}
            $rawAssets=& gh api --paginate --slurp "repos/$env:GH_REPO/releases/422599788/assets?per_page=100"
            if($LASTEXITCODE){throw 'Complete original release asset list unavailable'}
            $pages=($rawAssets -join "`n")|ConvertFrom-Json -NoEnumerate
            $release.assets=@(foreach($page in $pages){foreach($asset in $page){$asset}})
            return $release
          }
          $before=Get-ExpectedRelease
          [IO.File]::WriteAllText('stage-before.json',($before|ConvertTo-Json -Depth 60),[Text.UTF8Encoding]::new($false))
          [void](New-Item -ItemType Directory -Path pending)
          $receipts=@()
          foreach($file in $manifest.Files){
            $pending=[IO.Path]::GetFileNameWithoutExtension($file.Name)+'-pending-shelter-compat-20261026'+[IO.Path]::GetExtension($file.Name)
            $current=Get-ExpectedRelease;$existing=@($current.assets|Where-Object name -ceq $pending)
            if($existing.Count){if($existing.Count -ne 1 -or $existing[0].state -cne 'uploaded' -or $existing[0].size -ne $file.Bytes -or $existing[0].digest -ine ('sha256:'+$file.SHA256)){throw ('Existing pending is incomplete/different; no deletion/replacement allowed: '+$pending)};$asset=$existing[0]}
            else{
              $copy=Join-Path pending $pending;Copy-Item -LiteralPath (Join-Path $root $file.Name) -Destination $copy
              & gh release upload v1.1.0 $copy --repo $env:GH_REPO
              if($LASTEXITCODE){throw ('Pending upload failed: '+$pending)}
              $current=Get-ExpectedRelease;$matches=@($current.assets|Where-Object name -ceq $pending)
              if($matches.Count -ne 1 -or $matches[0].state -cne 'uploaded' -or $matches[0].size -ne $file.Bytes -or $matches[0].digest -ine ('sha256:'+$file.SHA256)){throw 'Uploaded server digest differs'};$asset=$matches[0]
            }
            $receipts+=[ordered]@{Name=$file.Name;PendingName=$pending;NewId=$asset.id;Bytes=$file.Bytes;SHA256=$file.SHA256}
          }
          $after=Get-ExpectedRelease
          foreach($old in $before.assets){$now=@($after.assets|Where-Object id -eq $old.id);if($now.Count -ne 1 -or $now[0].name -cne $old.name -or $now[0].size -ne $old.size -or $now[0].digest -cne $old.digest -or $now[0].state -cne $old.state){throw 'An existing asset changed during pending-only staging'}}
          if($after.name -cne $before.name -or $after.body -cne $before.body -or $after.published_at -cne $before.published_at){throw 'Original release metadata changed'}
          [IO.File]::WriteAllText('stage-after.json',($after|ConvertTo-Json -Depth 60),[Text.UTF8Encoding]::new($false))
          $proof=[ordered]@{Passed=$true;SourceCommit=$env:FROZEN_SOURCE;EXESHA256=$env:FROZEN_EXE;BuildRunId=$env:BUILD_RUN_ID;BuildWorkflowCommit=$env:BUILD_WORKFLOW_COMMIT;ManifestSHA256=$env:EXPECTED_MANIFEST_SHA256;StageRunId=$env:GITHUB_RUN_ID;ReleaseId=422599788;OnlyPendingNamesUploaded=$true;CanonicalOrHistoricalAssetsChanged=$false;ReleaseOrTagChanged=$false;Assets=$receipts}
          [IO.File]::WriteAllText('STAGED_RECEIPTS.json',($proof|ConvertTo-Json -Depth 20)+"`n",[Text.UTF8Encoding]::new($false))
      - name: Upload small staging proof only
        uses: actions/upload-artifact@v4
        with:
          name: rin-shelter-87135ce-staged
          if-no-files-found: error
          retention-days: 7
          path: |
            STAGED_RECEIPTS.json
            stage-before.json
            stage-after.json
